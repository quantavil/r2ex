name = "r2ex"
main = "src/index.ts"
compatibility_date = "2025-05-08"

[assets]
directory = "packages/dashboard/dist/spa"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/share/*"]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "r2ex-storage"
